<text x="560" y="345" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7280">5 V × 2k/(1k+2k) = 3.33 V</text>
<text x="560" y="361" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7280">never ECHO → GPIO directly</text>
<text x="30" y="350" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#6b7280" font-style="italic">Mount 40–100 cm up, under a lip, aimed slightly down at the approach.</text>
<text x="30" y="366" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#6b7280" font-style="italic">Leads > 1 m: add 100 nF across VCC/GND at the sensor.</text>
