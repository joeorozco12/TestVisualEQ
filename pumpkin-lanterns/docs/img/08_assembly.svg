<circle cx="30" cy="612" r="11" fill="#111"/>
<text x="30" y="616" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">1</text>
<text x="50" y="616" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#111">LDR on top under a hot-glue dome; wire in through the stem hole</text>
<circle cx="30" cy="632" r="11" fill="#111"/>
<text x="30" y="636" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">2</text>
<text x="50" y="636" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Grid hung from a skewer, conformal-coated back; lights the cut-outs from behind</text>
<circle cx="30" cy="652" r="11" fill="#111"/>
<text x="30" y="656" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">3</text>
<text x="50" y="656" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#111">HC-SR04 in an eye, under the lid lip, aimed slightly down at the approach</text>
<circle cx="30" cy="672" r="11" fill="#111"/>
<text x="30" y="676" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">4</text>
<text x="50" y="676" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Speaker in a sealed pod behind the mouth; rear sealed from the flesh</text>
<circle cx="30" cy="692" r="11" fill="#111"/>
<text x="30" y="696" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">5</text>
<text x="50" y="696" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#111">IP54 box: ESP32, shifter perfboard, amp, µSD, star terminal, power bank, silica gel</text>
<circle cx="30" cy="712" r="11" fill="#111"/>
<text x="30" y="716" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">6</text>
<text x="50" y="716" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#111">Single grommet exit at the bottom; every cable leaves with a drip loop</text>
<text x="16" y="752" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#6b7280" font-style="italic">Nothing bare touches flesh. Interior is wet, acidic, 100 % RH and rots in ~5 days. Lid on; condensation at dusk is the main risk → conformal coat.</text>
