; Pumpkin Lanterns — ESP32 addressable-LED lantern nodes
;
; Envs:
;   node         full firmware (src/main.cpp + all modules)
;   bench_*      single-module bench sketches (src/bench/*.cpp), same module code
;
; Build:   pio run -e node
; Upload:  pio run -e node -t upload
; Monitor: pio device monitor -b 115200
; Bench:   pio run -e bench_leds -t upload

[platformio]
default_envs = node
src_dir = src
include_dir = include

[common]
platform = espressif32@6.9.0          ; arduino-esp32 2.0.17 (IDF 4.4) — stable FastLED RMT + legacy I2S driver
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
board_build.partitions = min_spiffs.csv ; bigger app partition; no SPIFFS use (SD holds sounds)
build_flags =
    -std=gnu++17
    -Wall -Wextra -Wno-unused-parameter
    -DCORE_DEBUG_LEVEL=1
    -DFASTLED_RMT_BUILTIN_DRIVER=0  ; FastLED's own RMT ISR; lower jitter than IDF rmt_write_items
    -DFASTLED_RMT_MAX_CHANNELS=1    ; one strip per node; leave RMT channels free
build_unflags = -std=gnu++11
lib_deps =
    fastled/FastLED@3.7.8
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.1
    ; WiFi, WebServer, ESPmDNS, SD, SPI, Preferences, Wire: bundled with arduino-esp32

; ---------------------------------------------------------------------------
[env:node]
extends = common
build_src_filter = +<*> -<bench/>

; ---------------------------------------------------------------------------
; Bench sketches: each links the real module sources, swaps main.cpp for one test.
[bench]
extends = common
lib_deps = ${common.lib_deps}

[env:bench_leds]
extends = bench
build_src_filter = +<*> -<main.cpp> -<bench/> +<bench/bench_leds.cpp>

[env:bench_ultrasonic]
extends = bench
build_src_filter = +<*> -<main.cpp> -<bench/> +<bench/bench_ultrasonic.cpp>

[env:bench_light]
extends = bench
build_src_filter = +<*> -<main.cpp> -<bench/> +<bench/bench_light.cpp>

[env:bench_sun]
extends = bench
build_src_filter = +<*> -<main.cpp> -<bench/> +<bench/bench_sun.cpp>

[env:bench_audio]
extends = bench
build_src_filter = +<*> -<main.cpp> -<bench/> +<bench/bench_audio.cpp>

[env:bench_net]
extends = bench
build_src_filter = +<*> -<main.cpp> -<bench/> +<bench/bench_net.cpp>

[env:bench_power]
extends = bench
build_src_filter = +<*> -<main.cpp> -<bench/> +<bench/bench_power.cpp>
